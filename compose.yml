services:
  postgres:
    image: postgres:18-alpine
    container_name: {{project-name}}-postgres
    restart: unless-stopped
    # Credentials come from .env (never committed); see .env.example
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bind exclusively to localhost - not reachable from the LAN
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - {{project-name}}-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  {{project-name}}-postgres-data:
