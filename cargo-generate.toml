# cargo-generate config. See docs/development.md in the generated project for
# what this template actually contains.

[template]
cargo_generate_version = ">=0.20.0"

# hooks/post.rhai is excluded from Liquid substitution — Rhai scripts are
# never meant to go through it (cargo-generate itself errors on it: "invalid
# syntax"), and this one needs none anyway: it reads placeholder values at
# hook-execution time via variable::get(), not via text substitution.
#
# .github/workflows/release.yml is excluded for a different reason: it has
# no `{{project-name}}`/`{{crate_name}}` placeholders at all — every `{{`/
# `${{` in it is either a GitHub Actions expression or docker/metadata-
# action's own `{{version}}` syntax, none of it meant for cargo-generate.
# Liquid chokes on the unescaped `${{ }}` (cargo-generate < 0.24 aborts
# generation entirely: "Substitution skipped, found invalid syntax"), so
# excluding it outright is simpler and more honest than the `{% raw %}` dance
# below — there's nothing here for cargo-generate to substitute anyway.
#
# ci.yml is NOT excluded, because unlike release.yml it genuinely mixes real
# `{{project-name}}`/`{{crate_name}}` placeholders with `${{ }}` GitHub
# Actions expressions — so its `${{ }}` lines are individually wrapped in
# `{% raw %}` instead, letting the real placeholders elsewhere in the same
# file still substitute.
exclude = ["hooks/post.rhai", ".github/workflows/release.yml"]

[hooks]
post = ["hooks/post.rhai"]
