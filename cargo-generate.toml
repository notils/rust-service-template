# cargo-generate config. See docs/development.md in the generated project for
# what this template actually contains.

[template]
cargo_generate_version = ">=0.20.0"

# hooks/post.rhai is excluded from Liquid substitution — Rhai scripts are
# never meant to go through it (cargo-generate itself errors on it: "invalid
# syntax"), and this one needs none anyway: it reads placeholder values at
# hook-execution time via variable::get(), not via text substitution.
#
# ci.yml is NOT excluded — its `${{ }}` GitHub Actions expressions are
# individually wrapped in `{% raw %}` instead, so cargo-generate doesn't try
# to treat them as placeholders.
exclude = ["hooks/post.rhai"]

[hooks]
post = ["hooks/post.rhai"]
